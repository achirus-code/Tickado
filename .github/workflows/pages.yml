name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - website
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aktiviert GitHub Pages beim ersten Lauf automatisch (Source = GitHub Actions)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Nur den Website-Ordner veröffentlichen (index.html liegt dann im Root der Page)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
